name: Validar fundação SaaS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: vant_test
          POSTGRES_PASSWORD: disposable_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vant_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/vant_test
      DATABASE_URL: postgresql://vant_runtime:temporary_ci_runtime@127.0.0.1:5432/vant_test
      APP_ORIGIN: http://127.0.0.1:3000
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Conferir disponibilidade do PostgreSQL e do pgvector
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT current_database(), current_setting('server_version');"
          test "$(psql "$ADMIN_DATABASE_URL" -Atc "SELECT count(*) FROM pg_available_extensions WHERE name='vector'")" = 1
      - name: Validar migrations, API e restauração
        if: ${{ hashFiles('package.json') != '' }}
        run: bash scripts/ci.sh
