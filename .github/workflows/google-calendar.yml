name: Homologar leitura do Google Calendar
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leitura:
    if: github.ref == 'refs/heads/main'
    environment: google-calendar-homologacao
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Consultar agenda autorizada
        env:
          VANT_CALENDAR_CHECK: ${{ secrets.VANT_CALENDAR_CHECK }}
        run: node scripts/verify-google-calendar.mjs
