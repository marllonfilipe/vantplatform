<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111117"><meta name="crm-module" content="enabled"><title>V4NT · Operação comercial</title><link rel="stylesheet" href="/style.css"><script src="/app.js" type="module"></script></head>
<body>
<main id="login" hidden><section class="loginbox"><strong class="wordmark">V4NT<span> /</span></strong><h1>Acesse sua operação</h1><form id="loginForm">
<label>Identificador da empresa<input name="tenantId" required autocomplete="organization"></label><label>E-mail<input type="email" name="email" required autocomplete="username"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button class="primary">Entrar</button></form><p id="loginError" role="alert"></p></section></main>
<div id="shell" hidden><aside id="side"><div class="brand"><strong class="wordmark">V4NT<span> /</span></strong><span class="muted">Platform</span></div><nav id="navigation"></nav><div class="org"><small>Empresa</small><b id="tenantName"></b></div></aside>
<main id="workspace"><header><button id="menu" aria-label="Alternar navegação" aria-controls="side">☰</button><form id="search"><input aria-label="Busca global" placeholder="Buscar na plataforma" name="q" maxlength="100" required><button>Buscar</button></form><button id="notifications">Alertas</button><button id="profile">Meu perfil</button></header>
<div class="page"><div class="heading"><div><p id="context" class="eyebrow"></p><h1 id="pageTitle">Visão geral</h1></div><div id="filters"><select id="period" aria-label="Período"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option></select><select id="team" aria-label="Equipe"><option value="">Todas as equipes</option></select></div></div><div id="status" role="status"></div><div id="content"></div></div></main></div>
<dialog id="dialog"><button id="closeDialog" aria-label="Fechar">Fechar</button><h2 id="dialogTitle"></h2><div id="dialogBody"></div></dialog></body></html>
